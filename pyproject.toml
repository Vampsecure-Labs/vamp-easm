[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vamp-easm"
version = "1.1"
description = "External Attack Surface Management (EASM) scanner for authorized audits"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "VampSecure Studios", email = "contact@vampsecurestudios.com" }]
keywords = ["security", "pentest", "audit", "cybersecurity", "vampsecure", "easm", "attack-surface", "external", "reconnaissance"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "rich>=13.7.0",
]


[project.scripts]
vamp-easm = "vamp_easm:main"

[project.urls]
Homepage = "https://github.com/Vampsecure-Labs/vamp-easm"
Repository = "https://github.com/Vampsecure-Labs/vamp-easm"

[tool.setuptools]
py-modules = ["vamp_easm", "vampsec_report"]

[tool.setuptools.packages.find]
where = ["."]
include = ["easm*"]
